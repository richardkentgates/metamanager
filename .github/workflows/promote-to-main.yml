name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "test" ]]; then
            echo "::error::This workflow can only be run from the test branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: test -> main"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check CI status for the dev tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin dev
          DEV_SHA=$(git rev-parse origin/dev)
          echo "dev HEAD: $DEV_SHA"

          LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
          echo "latest dev CI: status=${STATUS} conclusion=${CONCLUSION} head=${HEAD_SHA}"

          # Pin the gate to the exact tree being promoted (accept dev HEAD
          # or its parent). No green pinned run → CAUSE one and wait.
          PARENT_SHA=$(git rev-parse "$DEV_SHA^1" 2>/dev/null || echo none)
          needs_ci=false
          [[ "$STATUS" != "completed" || "$STATUS" == "null" || -z "$STATUS" ]] && needs_ci=true
          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            needs_ci=true
          fi
          if [[ "$needs_ci" == "true" ]]; then
            echo "No green CI run for the dev tree ($DEV_SHA) — dispatching CI and waiting..."
            gh workflow run "Dev CI — Lint & Version Bump" --ref dev
            for i in $(seq 1 40); do
              sleep 15
              LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
                --workflow "ci.yml" \
                --branch "dev" \
                --limit 1 \
                --json status,conclusion,headSha \
                --jq '.[0]')
              STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
              CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
              HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
              echo "  wait $i: status=${STATUS} head=${HEAD_SHA}"
              if [[ "$STATUS" == "completed" ]] \
                 && { [[ "$HEAD_SHA" == "$DEV_SHA" ]] || [[ "$HEAD_SHA" == "$PARENT_SHA" ]]; }; then
                break
              fi
            done
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on dev before promoting."
            exit 1
          fi

          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            echo "::error::Green CI is for a different tree (head=${HEAD_SHA}, dev=${DEV_SHA})."
            exit 1
          fi

          # Promote to Main only ships what test actually contains —
          # dispatching early would ship stale.
          git fetch origin test
          if ! git diff --quiet origin/test origin/dev; then
            echo "::error::test does not contain dev — promote to test first (or wait for it to finish)."
            git diff --stat origin/test origin/dev | head -20
            exit 1
          fi

          echo "CI passed for the promoted tree and test contains dev. Proceeding with promotion."

          echo "CI passed. Proceeding with promotion."

  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build .deb
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dpkg-dev build-essential
          dpkg-buildpackage -us -uc -b
          ls -lh ../metamanager_*.deb

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: ../metamanager_*.deb
          generate_release_notes: true

      - name: Deploy to apt repo
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Two connections only (1 scp + 1 ssh) — the apt server rate-limits
          # port 22 and burst deploys trip it. StrictHostKeyChecking=no covers
          # what ssh-keyscan used to do.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ../metamanager_*.deb \
            "${APT_USER}@${APT_HOST}:/tmp/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/pool/m/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/pool && mv /tmp/metamanager_*.deb /var/www/html/pool/m/metamanager/ && bash /usr/local/bin/rebuild-apt-metadata.sh stable"

          echo "Release deployed to apt repo"

      - name: Stamp site version on gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghpages origin/gh-pages
          cd /tmp/ghpages
          grep -rl 'class="version"' --include='*.html' . | xargs -r sed -i "s/\(<span class=\"version\">\)[^<]*/\1v${{ steps.version.outputs.version }}/"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: stamp site version v${{ steps.version.outputs.version }}"
            git push origin HEAD:gh-pages
          fi
          git worktree remove /tmp/ghpages

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created with .deb"
          echo "  ✓ .deb deployed to apt repo"
          echo ""
          echo "  Production updates via: apt-get upgrade metamanager"
          echo ""
