name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "test" ]]; then
            echo "::error::This workflow can only be run from the test branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: test -> main"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status on dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking CI status for workflow 'ci.yml' on branch 'dev'..."

          LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,name \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          NAME=$(echo "$LATEST_RUN" | jq -r '.name')

          echo "Latest run: name=${NAME}, status=${STATUS}, conclusion=${CONCLUSION}"

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on test before promoting."
            exit 1
          fi

          echo "CI passed. Proceeding with promotion."

  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build .deb
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dpkg-dev build-essential
          dpkg-buildpackage -us -uc -b
          ls -lh ../metamanager_*.deb

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: ../metamanager_*.deb
          generate_release_notes: true

      - name: Deploy to apt repo
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/pool/m/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/pool"

          scp -i ~/.ssh/deploy_key \
            ../metamanager_*.deb \
            "${APT_USER}@${APT_HOST}:/var/www/html/pool/m/metamanager/"

          # IMPORTANT: dpkg-scanpackages MUST scan entire pool/ (not pool/m/metamanager)
          # so all packages (gcm + metamanager) appear in the Packages index.
          ssh -i ~/.ssh/deploy_key "${APT_USER}@${APT_HOST}" << 'REMOTE'
            cd /var/www/html

            sudo dpkg-scanpackages pool/ /dev/null > dists/stable/main/binary-amd64/Packages
            sudo gzip -k -f dists/stable/main/binary-amd64/Packages

            sudo apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="apt.richardkentgates.com" \
              -o APT::FTPArchive::Release::Label="GCM APT Repository" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="GCM apt repository" \
              release dists/stable > dists/stable/Release

            # Sign as the deploy user (key lives in its keyring); root has no
            # secret key, so `sudo gpg` would silently produce a stale InRelease.
            set -e
            gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --clearsign -o /tmp/InRelease dists/stable/Release
            gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --armor --detach-sign -o /tmp/Release.gpg dists/stable/Release
            sudo cp /tmp/InRelease dists/stable/InRelease
            sudo cp /tmp/Release.gpg dists/stable/Release.gpg

            echo "Release deployed to apt repo"
          REMOTE

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created with .deb"
          echo "  ✓ .deb deployed to apt repo"
          echo ""
          echo "  Production updates via: apt-get upgrade metamanager"
          echo ""
