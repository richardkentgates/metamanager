name: Promote to Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Merge, Build & Deploy to Apt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: test
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --no-edit

      - name: Push test
        run: git push origin test

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dpkg-dev build-essential

      - name: Determine version
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../metamanager_*.deb

      - name: Deploy to apt repo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/pool/m/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/pool"

          scp -i ~/.ssh/deploy_key \
            ../metamanager_*.deb \
            "${APT_USER}@${APT_HOST}:/var/www/html/pool/m/metamanager/"

          # IMPORTANT: dpkg-scanpackages MUST scan entire pool/ (not pool/m/metamanager)
          # so all packages (gcm + metamanager) appear in the Packages index.
          ssh -i ~/.ssh/deploy_key "${APT_USER}@${APT_HOST}" << 'REMOTE'
            cd /var/www/html

            sudo dpkg-scanpackages pool/ /dev/null > dists/test/main/binary-amd64/Packages
            sudo gzip -k -f dists/test/main/binary-amd64/Packages

            sudo apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="apt.richardkentgates.com" \
              -o APT::FTPArchive::Release::Label="GCM APT Repository" \
              -o APT::FTPArchive::Release::Suite="test" \
              -o APT::FTPArchive::Release::Codename="test" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="GCM apt repository (test)" \
              release dists/test > dists/test/Release

            sudo gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --clearsign --output dists/test/InRelease dists/test/Release
            sudo gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --armor --detach-sign --output dists/test/Release.gpg dists/test/Release

            echo "Test .deb deployed to apt repo (test)"
          REMOTE

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Test promotion v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged dev → test"
          echo "  ✓ .deb deployed to apt repo (test)"
          echo ""
