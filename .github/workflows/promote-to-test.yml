name: Promote to Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Merge, Build & Deploy to Apt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: test
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --no-edit

      - name: Push test
        run: git push origin test

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dpkg-dev build-essential

      - name: Determine version
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # ── Cross-repo: ensure daemon-compatibility.json in the plugin repo ──
      # The daemon gets promoted to apt BEFORE the plugin is released. The
      # self-updater reads daemon-compatibility.json from the installed plugin
      # to know which daemon version is required. If the map is not updated
      # first, the self-updater shows "ahead" (daemon newer than map expects).
      #
      # This step clones the plugin repo, reads its current MM_VERSION, adds
      # a map entry if missing, and pushes to dev. The plugin CI will then
      # auto-bump MM_VERSION on the next push — the entry remains valid for
      # the version that was on dev when this ran.
      #
      # REQUIRES: PLUGIN_REPO_PAT secret — GitHub PAT with `contents: write`
      # on richardkentgates/metamanager-plugin.
      - name: Auto-update compatibility map
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_REPO_PAT }}
        run: |
          set -euo pipefail
          DAEMON_VER="${{ steps.version.outputs.version }}"
          echo "Ensuring daemon-compatibility.json maps daemon v${DAEMON_VER}..."

          # Fetch current plugin version from plugin repo dev branch
          PLUGIN_VER=$(gh api repos/richardkentgates/metamanager-plugin/contents/metamanager.php?ref=dev \
            -q '.content' | base64 -d | grep "define('MM_VERSION'" | sed "s/.*'\\([^']*\\)'.*/\\1/")
          echo "Current plugin version on dev: ${PLUGIN_VER}"

          # Check if the map already has this daemon version
          MAP=$(gh api repos/richardkentgates/metamanager-plugin/contents/daemon-compatibility.json?ref=dev \
            -q '.content' | base64 -d 2>/dev/null || echo "{}")

          if echo "$MAP" | jq -e --arg dv "$DAEMON_VER" 'to_entries[] | select(.value == $dv)' > /dev/null 2>&1; then
            echo "✓ daemon-compatibility.json already maps daemon v${DAEMON_VER}"
          else
            echo "Adding mapping: plugin v${PLUGIN_VER} → daemon v${DAEMON_VER}"

            TMPDIR=$(mktemp -d)
            git clone --depth 1 https://x-access-token:${PLUGIN_PAT}@github.com/richardkentgates/metamanager-plugin.git "$TMPDIR"
            cd "$TMPDIR"

            # Add/update the entry
            jq --arg pv "$PLUGIN_VER" --arg dv "$DAEMON_VER" '.[$pv] = $dv' \
              daemon-compatibility.json > daemon-compatibility.json.tmp
            mv daemon-compatibility.json.tmp daemon-compatibility.json

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add daemon-compatibility.json
            git commit -m "ci: map plugin v${PLUGIN_VER} → daemon v${DAEMON_VER}"
            git push origin dev

            cd /
            rm -rf "$TMPDIR"
            echo "✓ daemon-compatibility.json updated: plugin v${PLUGIN_VER} → daemon v${DAEMON_VER}"
          fi

          # Final validation — fail promotion if map is still missing
          MAP=$(gh api repos/richardkentgates/metamanager-plugin/contents/daemon-compatibility.json?ref=dev \
            -q '.content' | base64 -d 2>/dev/null || echo "{}")
          if echo "$MAP" | jq -e --arg dv "$DAEMON_VER" 'to_entries[] | select(.value == $dv)' > /dev/null 2>&1; then
            echo "✓ daemon-compatibility.json validated for daemon v${DAEMON_VER}"
          else
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  BLOCKED: daemon-compatibility.json missing mapping for v${DAEMON_VER}"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "  Auto-update failed. Check PLUGIN_REPO_PAT secret and plugin repo access."
            echo ""
            exit 1
          fi

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../metamanager_*.deb

      - name: Deploy to apt repo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/pool/m/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/pool"

          scp -i ~/.ssh/deploy_key \
            ../metamanager_*.deb \
            "${APT_USER}@${APT_HOST}:/var/www/html/pool/m/metamanager/"

          # IMPORTANT: dpkg-scanpackages MUST scan entire pool/ (not pool/m/metamanager)
          # so all packages (gcm + metamanager) appear in the Packages index.
          ssh -i ~/.ssh/deploy_key "${APT_USER}@${APT_HOST}" << 'REMOTE'
            cd /var/www/html

            sudo dpkg-scanpackages pool/ /dev/null > dists/test/main/binary-amd64/Packages
            sudo gzip -k -f dists/test/main/binary-amd64/Packages

            sudo apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="apt.richardkentgates.com" \
              -o APT::FTPArchive::Release::Label="GCM APT Repository" \
              -o APT::FTPArchive::Release::Suite="test" \
              -o APT::FTPArchive::Release::Codename="test" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="GCM apt repository (test)" \
              release dists/test > dists/test/Release

            # Sign as the deploy user (key lives in its keyring); root has no
            # secret key, so `sudo gpg` silently produced a stale InRelease.
            set -e
            gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --clearsign -o /tmp/InRelease dists/test/Release
            gpg --batch --yes --default-key E0395903AE72DD661AD11DF76C0D53C3F9B96454 \
              --armor --detach-sign -o /tmp/Release.gpg dists/test/Release
            sudo cp /tmp/InRelease dists/test/InRelease
            sudo cp /tmp/Release.gpg dists/test/Release.gpg

            echo "Test .deb deployed to apt repo (test)"
          REMOTE

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Test promotion v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged dev → test"
          echo "  ✓ .deb deployed to apt repo (test)"
          echo ""
