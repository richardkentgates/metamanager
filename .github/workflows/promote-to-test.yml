name: Promote to Test

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "dev" ]]; then
            echo "::error::This workflow can only be run from the dev branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: dev -> test"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check CI status for the dev tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin dev
          DEV_SHA=$(git rev-parse origin/dev)
          echo "dev HEAD: $DEV_SHA"

          LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
          echo "latest dev CI: status=${STATUS} conclusion=${CONCLUSION} head=${HEAD_SHA}"

          # Pin the gate to the exact tree being promoted (accept dev HEAD
          # or its parent — the CI bot's version bump sits on top of the
          # tested push). If no green pinned run exists, CAUSE one and wait:
          # tests are never skipped.
          PARENT_SHA=$(git rev-parse "$DEV_SHA^1" 2>/dev/null || echo none)
          pinned() { [[ "$HEAD_SHA" == "$DEV_SHA" || "$HEAD_SHA" == "$PARENT_SHA" ]]; }

          if [[ "$STATUS" == "completed" ]] && pinned; then
            : # green run already covers the tree
          else
            # A run in flight for the tree: wait for it. Dispatch only when
            # nothing covers the tree — and never rely on dispatch while a
            # run exists (GITHUB_TOKEN may be unable to dispatch: 403).
            if [[ "$STATUS" == "in_progress" || "$STATUS" == "queued" ]] && pinned; then
              echo "CI in flight for the dev tree — waiting for it..."
            else
              echo "No CI run for the dev tree ($DEV_SHA) — dispatching CI..."
              if ! gh workflow run "Dev CI — Lint & Version Bump" --ref dev; then
                echo "::error::Cannot dispatch CI (token permissions). Trigger the CI workflow manually, then re-run this promotion."
                exit 1
              fi
            fi
            for i in $(seq 1 40); do
              sleep 15
              LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
                --workflow "ci.yml" \
                --branch "dev" \
                --limit 1 \
                --json status,conclusion,headSha \
                --jq '.[0]')
              STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
              CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
              HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
              echo "  wait $i: status=${STATUS} head=${HEAD_SHA}"
              if [[ "$STATUS" == "completed" ]] && pinned; then
                break
              fi
            done
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on dev before promoting."
            exit 1
          fi

          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            echo "::error::Green CI is for a different tree (head=${HEAD_SHA}, dev=${DEV_SHA})."
            exit 1
          fi

          echo "CI passed for the promoted tree. Proceeding with promotion."

  promote:
    name: Merge, Build & Deploy to Apt
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: test
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --no-edit

      - name: Push test
        run: git push origin test

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dpkg-dev build-essential

      - name: Determine version
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          ls -lh ../metamanager_*.deb

      - name: Deploy to apt repo
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Two connections only (1 scp + 1 ssh) — the apt server rate-limits
          # port 22 and burst deploys trip it. StrictHostKeyChecking=no covers
          # what ssh-keyscan used to do.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ../metamanager_*.deb \
            "${APT_USER}@${APT_HOST}:/tmp/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/pool/m/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/pool && mv /tmp/metamanager_*.deb /var/www/html/pool/m/metamanager/ && bash /usr/local/bin/rebuild-apt-metadata.sh test"

          echo "Test .deb deployed to apt repo (test)"

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Test promotion v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged dev → test"
          echo "  ✓ .deb deployed to apt repo (test)"
          echo ""
