<h4>Requirements</h4>
<ul>
    <li>Linux (Debian/Ubuntu)</li>
    <li>PHP 8.0+</li>
    <li>WordPress 6.2+</li>
    <li>ExifTool (libimage-exiftool-perl)</li>
    <li>jpegtran (libjpeg-turbo-progs)</li>
    <li>optipng</li>
    <li>cwebp (webp)</li>
    <li>ffmpeg (optional, for video)</li>
    <li>avifenc (libavif-bin, optional)</li>
</ul>
